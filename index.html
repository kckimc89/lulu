<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 탐험대 V3</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9ea;color:#493c50;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}#a{max-width:850px;margin:auto;padding:16px}.p{background:white;border-radius:28px;padding:20px;text-align:center}h1{font-size:40px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode,.n,.go{border:0;font:inherit;font-weight:850}.mode{min-height:120px;border:3px solid #eadfb9;border-radius:22px;background:white;font-size:18px}.mode b{display:block;font-size:42px}.lock{opacity:.4}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px auto;max-width:650px}.n{height:88px;border:4px solid #ecdba8;border-radius:20px;background:white;font-size:41px}.n.s{border-color:#ff789c;background:#fff0f5}.ten{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:410px;margin:12px auto}.c{aspect-ratio:1;border:3px solid #b9abc2;border-radius:8px}.f{background:#ffd76a}.msg{font-size:20px;font-weight:850;min-height:55px}.tag{display:inline-block;padding:6px 10px;margin:4px;background:#f3edf6;border-radius:14px;font-weight:800}.go{padding:13px 19px;margin:5px;border-radius:18px;background:#ff789c;color:white;font-size:19px}.soft{padding:11px 16px;border:0;border-radius:16px;font-weight:800}.top{display:flex;justify-content:space-between;margin-bottom:10px}.pill{background:white;padding:8px 12px;border-radius:16px;font-weight:800}@media(max-width:500px){.cards{grid-template-columns:repeat(3,1fr)}.n{height:78px}}
</style></head><body><div id="a"></div><script>
(function(){var A=document.getElementById("a"),stars=0,pieces=0,open3=false;
function bar(){return '<div class="top"><span class="pill">⭐ '+stars+'</span><span class="pill">🧩 '+pieces+'/4</span></div>'}
function home(){A.innerHTML=bar()+'<div class="p"><h1>🔟 10 탐험대 V3</h1><p>이번에는 숨어 있는 10을 <b>전부</b> 찾아볼까?</p><div class="menu"><button class="mode" id="two"><b>🔍</b>두 장의 비밀<br>모든 방법 찾기</button><button class="mode" id="use"><b>🏕️</b>카드 모두 활용<br>10 묶음 만들기</button><button class="mode '+(open3?'':'lock')+'" id="three"><b>🕵️</b>세 장의 비밀<br>'+(open3?'열렸어요!':'두 장 완료 후')+'</button><button class="mode lock"><b>👑</b>10 마스터<br>다음 탐험</button></div></div>';document.getElementById("two").onclick=function(){discover(2)};document.getElementById("use").onclick=use;document.getElementById("three").onclick=function(){if(open3)discover(3)}}
function combos(a,k){var o=[];function r(s,c){if(c.length===k){if(c.reduce(function(x,y){return x+y},0)===10){var q=c.slice().sort(function(x,y){return x-y}).join("+");if(o.indexOf(q)<0)o.push(q)}return}for(var i=s;i<a.length;i++)r(i+1,c.concat(a[i]))}r(0,[]);return o}
function frame(n){var t=document.getElementById("ten");t.innerHTML="";for(var i=0;i<10;i++){var c=document.createElement("div");c.className="c"+(i<Math.min(n,10)?" f":"");t.appendChild(c)}}
function discover(k){var board=k===2?[1,2,3,4,5,5,6,7,8,9]:[1,2,3,4,5,6,7,8,9],ans=combos(board,k),found={},sel=[];
A.innerHTML=bar()+'<div class="p"><h2>'+(k===2?'🔍 두 장의 비밀':'🕵️ 세 장의 비밀')+'</h2><p>'+k+'장을 골라 10이 되는 서로 다른 방법을 모두 찾아봐.</p><b id="prog">발견한 비밀 0 / ?</b><div class="ten" id="ten"></div><div class="msg" id="sum">어디에 10이 숨어 있을까? 👀</div><div class="cards" id="cards"></div><div id="found"></div><div class="msg" id="msg">같은 조합은 한 번만 발견으로 세어요.</div><button class="go" id="all">정말 다 찾았을까?</button><button class="soft" id="back">다른 놀이</button></div>';frame(0);
board.forEach(function(v){var b=document.createElement("button");b.className="n";b.textContent=v;b.onclick=function(){if(b.classList.contains("s")){b.classList.remove("s");sel=sel.filter(function(x){return x.b!==b})}else if(sel.length<k){b.classList.add("s");sel.push({b:b,v:v})}var s=sel.reduce(function(x,y){return x+y.v},0);frame(s);document.getElementById("sum").textContent=sel.length?sel.map(function(x){return x.v}).join(" + ")+" → "+s:"어디에 10이 숨어 있을까?";if(sel.length===k)setTimeout(test,180)};document.getElementById("cards").appendChild(b)});
function reset(){sel.forEach(function(x){x.b.classList.remove("s")});sel=[];frame(0)}
function test(){var v=sel.map(function(x){return x.v}).sort(function(x,y){return x-y}),s=v.reduce(function(x,y){return x+y},0),key=v.join("+"),m=document.getElementById("msg");if(s===10){if(found[key])m.textContent="이 방법은 이미 발견했어! 다른 비밀은? 🔍";else{found[key]=1;stars++;m.textContent="✨ 새로운 비밀! "+key+" = 10";var ks=Object.keys(found);document.getElementById("prog").textContent="발견한 비밀 "+ks.length+" / ?";document.getElementById("found").innerHTML=ks.map(function(q){return '<span class="tag">'+q+'=10</span>'}).join("")}}else m.textContent=s<10?(10-s)+"만큼 더 있으면 10! 👀":"10을 조금 지나갔네 👀";setTimeout(reset,600)}
document.getElementById("all").onclick=function(){var n=Object.keys(found).length,m=document.getElementById("msg");if(n===ans.length){document.getElementById("prog").textContent="🎉 "+n+"가지 모두 발견!";m.textContent="이 판의 10을 전부 찾았어요!";pieces=Math.min(4,pieces+1);if(k===2)open3=true;setTimeout(home,1000)}else{document.getElementById("prog").textContent="발견한 비밀 "+n+" / "+ans.length;m.textContent="아직 숨어 있는 10이 "+(ans.length-n)+"가지 더 있어 👀"}};document.getElementById("back").onclick=home}
function use(){var d=[1,9,2,8,3,7,4,6,5,5,1,9],sel=[],made=0;A.innerHTML=bar()+'<div class="p"><h2>🏕️ 카드 모두 활용</h2><p>성공한 카드는 사라져요. 남은 카드로 계속 10을 만들어봐.</p><div class="ten" id="ten"></div><div class="cards" id="cards"></div><div class="msg" id="msg">몇 묶음을 만들 수 있을까?</div><button class="soft" id="back">다른 놀이</button></div>';frame(0);d.sort(function(){return Math.random()-.5});d.forEach(function(v){var b=document.createElement("button");b.className="n";b.textContent=v;b.onclick=function(){if(b.disabled)return;if(b.classList.contains("s")){b.classList.remove("s");sel=sel.filter(function(x){return x.b!==b})}else if(sel.length<2){b.classList.add("s");sel.push({b:b,v:v})}frame(sel.reduce(function(x,y){return x+y.v},0));if(sel.length===2)setTimeout(test,180)};document.getElementById("cards").appendChild(b)});function test(){var s=sel[0].v+sel[1].v;if(s===10){sel.forEach(function(x){x.b.disabled=true;x.b.style.visibility="hidden"});sel=[];made++;stars++;document.getElementById("msg").textContent="✨ "+made+"묶음 발견!";frame(0)}else{document.getElementById("msg").textContent=s<10?(10-s)+"만큼 부족해 👀":"10을 지나갔네 👀";setTimeout(function(){sel.forEach(function(x){x.b.classList.remove("s")});sel=[];frame(0)},600)}}document.getElementById("back").onclick=home}home()})();
</script></body></html>

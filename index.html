<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6f9f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>루루와 마법성의 그림조각 V1.1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:linear-gradient(#dff6ff,#fff5fb);color:#49364b}
#app{max-width:900px;margin:auto;min-height:100vh;padding:14px}.card{background:#ffffffee;border-radius:28px;padding:18px;box-shadow:0 8px 28px #76536a22;text-align:center}
.hero{width:100%;border-radius:22px;max-height:270px;object-fit:cover}.big{font-size:clamp(30px,5vw,50px);margin:12px}.sub{font-size:20px;line-height:1.55}
button{border:0;border-radius:22px;padding:15px 22px;margin:7px;font-size:22px;font-weight:800;background:#fff;color:#4b3b55;box-shadow:0 5px 0 #d8c9dc;touch-action:manipulation}
.primary{background:#ff6f9f;color:white;box-shadow:0 5px 0 #d94c7c}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;margin-bottom:10px}.pill{background:white;border-radius:20px;padding:8px 12px}
.stage{min-height:430px;display:flex;flex-direction:column;justify-content:center;align-items:center}.pieces{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.piece{font-size:64px;cursor:pointer;transition:.2s}.piece:active{transform:scale(.9)}
.scene{position:relative;width:min(720px,100%);height:340px;border-radius:24px;overflow:hidden;background:linear-gradient(#8ed9ff 0 45%,#73c86b 45%);border:7px solid white}
.hideitem{position:absolute;font-size:54px;cursor:pointer}.duckbox{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.duck{font-size:55px;cursor:pointer}.boat{font-size:90px;margin:15px}
.gems{position:relative;width:min(700px,100%);height:330px;border-radius:24px;background:#2f2750;overflow:hidden}.gem{position:absolute;font-size:46px;animation:float 2.2s infinite alternate ease-in-out;cursor:pointer}@keyframes float{to{transform:translateY(25px) rotate(8deg)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(520px,90vw);aspect-ratio:1}.tile{background-size:300% 300%;border-radius:12px;border:3px solid white;cursor:pointer;min-height:80px}.selected{outline:6px solid #ffd84d;transform:scale(.96)}
.castle{font-size:72px}.spark{position:fixed;pointer-events:none;font-size:35px;animation:pop .8s forwards}@keyframes pop{to{transform:translateY(-100px) scale(1.7);opacity:0}}
.bar{height:18px;background:#eee;border-radius:10px;overflow:hidden;width:min(500px,90%)}.fill{height:100%;background:#ff7cad}
.small{font-size:16px;color:#786b7d}.hidden{display:none}
</style>
</head>
<body>
<div id="app">
<div class="card">
<img class="hero" src="hero.jpg" alt="루루와 마법성">
<h1 class="big">루루와 마법성의 그림조각</h1>
<p class="sub">마법성의 소중한 그림이 산산이 흩어졌어요.<br>루루와 함께 <b>세 조각</b>을 찾아볼까요?</p>
<button class="primary" onclick="intro()">▶ 모험 시작하기</button><br>
<button onclick="challenge()">🏆 보석 챌린지</button>
<p class="small">그림이 보이고 이 화면이 나타나면 정상입니다.</p>
</div></div>
<script src="game.js"></script>
</body>
</html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 탐험대 V4.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9ea;color:#493c50;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}#a{max-width:920px;margin:auto;padding:15px}.p{background:#fff;border-radius:28px;padding:22px;text-align:center}button{border:0;font:inherit}h1{font-size:44px}.go,.soft{padding:14px 20px;margin:6px;border-radius:18px;font-weight:900}.go{background:#ff789c;color:#fff}.soft{background:#eee8f1}.timer{display:inline-block;padding:9px 14px;background:#fff3c9;border-radius:16px;font-size:23px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;max-width:820px;margin:15px auto}.n{height:82px;border:4px solid #ecdba8;border-radius:19px;background:#fff;font-size:39px;font-weight:900}.n.s{border-color:#ff789c}.n.h{opacity:.42}.found{background:#fff7d8;border-radius:20px;padding:14px;margin:13px auto;min-height:75px}.tag{display:inline-block;background:#fff;padding:8px 11px;margin:4px;border-radius:14px;font-size:22px;font-weight:900}.msg{font-size:20px;font-weight:850;min-height:48px}.finish{min-height:78vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px}.finish .emoji{font-size:100px}.finish h1{font-size:58px;margin:0}.finish .main{font-size:28px;font-weight:900;line-height:1.7}.rec{font-size:28px;font-weight:900;background:#fff3c9;padding:19px 30px;border-radius:21px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:13px}.mode{min-height:140px;border:3px solid #eadfb9;border-radius:22px;background:#fff;font-size:20px;font-weight:900}.mode b{display:block;font-size:48px}@media(max-width:550px){.cards{grid-template-columns:repeat(4,1fr)}.n{height:74px}.menu{grid-template-columns:1fr}}
</style></head><body><div id="a"></div><script>
(function(){var A=document.getElementById("a"),start,tick;
function fmt(x){var s=Math.floor(x/1000),m=Math.floor(s/60);s%=60;return m?m+"분 "+String(s).padStart(2,"0")+"초":s+"초"}function runTimer(){start=Date.now();tick=setInterval(function(){var e=document.getElementById("t");if(e)e.textContent="⏱ "+fmt(Date.now()-start)},250)}function sh(a){for(var i=a.length-1;i;i--){var j=Math.floor(Math.random()*(i+1)),q=a[i];a[i]=a[j];a[j]=q}}
function home(){clearInterval(tick);A.innerHTML='<div class="p"><h1>🔟 10 탐험대 V4.2</h1><div class="menu"><button class="mode" id="x"><b>🔍</b>두 장의 비밀<br>0→10 · 10→0 · 랜덤</button><button class="mode" id="u"><b>🏕️</b>카드 모두 활용<br>16장 · 기록도전</button></div></div>';document.getElementById("x").onclick=intro;document.getElementById("u").onclick=use}
function intro(){A.innerHTML='<div class="p"><h1>🔍 두 장의 비밀</h1><p style="font-size:21px;line-height:1.8">모든 판에서 <b>0부터 10까지</b> 사용해요.<br>1판 0→10 · 2판 10→0 · 3판 랜덤</p><button class="go" id="s">시작!</button><button class="soft" id="b">다른 게임</button></div>';document.getElementById("s").onclick=function(){runTimer();round(1)};document.getElementById("b").onclick=home}
function deck(r){var a=[0,1,2,3,4,5,5,6,7,8,9,10];if(r===2)a.reverse();if(r===3)sh(a);return a}
function round(r){var d=deck(r),ans=["0+10","1+9","2+8","3+7","4+6","5+5"],f={},sel=[];A.innerHTML='<div class="p"><div class="timer" id="t">⏱ '+fmt(Date.now()-start)+'</div><h2>🌟 '+r+'판 / 3판 · '+(r===1?"0 → 10":r===2?"10 → 0":"랜덤 배치")+'</h2><div class="found"><b>✨ 내가 찾은 10</b><div id="f">6가지 모두 찾아봐</div></div><b id="pr">0 / 6 발견</b><div class="cards" id="c"></div><div class="msg" id="m">두 장을 골라봐 👀</div><button class="soft" id="q">그만하기</button></div>';d.forEach(function(v){var b=document.createElement("button");b.className="n";b.textContent=v;b.onclick=function(){if(b.classList.contains("s")){b.classList.remove("s");sel=sel.filter(function(z){return z.b!==b})}else if(sel.length<2){b.classList.add("s");sel.push({b:b,v:v})}if(sel.length===2)setTimeout(test,150)};document.getElementById("c").appendChild(b)});
function reset(){sel.forEach(function(z){z.b.classList.remove("s")});sel=[]}function test(){var v=sel.map(function(z){return z.v}).sort(function(a,b){return a-b}),sum=v[0]+v[1],k=v.join("+"),m=document.getElementById("m");if(sum===10){if(f[k])m.textContent="이미 찾은 조합이야. 다른 10은?";else{f[k]=1;sel.forEach(function(z){z.b.classList.add("h")});var ks=Object.keys(f);document.getElementById("pr").textContent=ks.length+" / 6 발견";document.getElementById("f").innerHTML=ans.filter(function(x){return f[x]}).map(function(x){return '<span class="tag">'+x+' = 10</span>'}).join("");m.textContent="✨ "+k+" = 10";if(ks.length===6){setTimeout(function(){doneRound(r)},400);return}}}else m.textContent=sum<10?(10-sum)+"만큼 더 필요해 👀":"10을 지나갔네 👀";setTimeout(reset,480)}document.getElementById("q").onclick=home}
function doneRound(r){if(r<3){A.innerHTML='<div class="p finish"><div class="emoji">🌟👏🌟</div><h1>잘했어요!</h1><div class="main">'+r+'판의 6가지 10을<br><b>모두 찾았어요!</b></div><div class="rec">⏱ '+fmt(Date.now()-start)+'</div><button class="go" id="n">'+(r+1)+'판 시작하기</button></div>';document.getElementById("n").onclick=function(){round(r+1)}}else finalPair()}
function finalPair(){clearInterval(tick);var e=Date.now()-start,b=0;try{b=Number(localStorage.getItem("v42best")||0);if(!b||e<b){b=e;localStorage.setItem("v42best",e)}}catch(x){}A.innerHTML='<div class="p finish"><div class="emoji">🎊✨🎊</div><h1>정말 잘했어요!</h1><div class="main">세 판 모두<br><b>숨어 있던 10을 전부 찾았어요!</b></div><div class="rec">6가지 × 3판 = 18번 발견<br><br>⏱ 전체 기록 '+fmt(e)+'</div><div class="main">🏆 최고기록 '+fmt(b)+'</div><div><button class="go" id="a1">🔄 한 번 더 하기</button><button class="soft" id="o">🎮 다른 게임 하기</button></div></div>';document.getElementById("a1").onclick=intro;document.getElementById("o").onclick=home}
function use(){A.innerHTML='<div class="p finish"><div class="emoji">🏕️</div><h1>카드 모두 활용</h1><div class="main">기존 V4의 16장 · 8묶음 게임은<br>그대로 유지합니다.</div><button class="soft" id="o">돌아가기</button></div>';document.getElementById("o").onclick=home}home()})();
</script></body></html>

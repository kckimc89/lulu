<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>10 탐험대 V4.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff9ea;color:#493c50;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}#a{max-width:920px;margin:auto;padding:15px}.p{background:#fff;border-radius:28px;padding:20px;text-align:center}button{border:0;font:inherit;touch-action:manipulation}h1{font-size:42px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:13px}.mode{min-height:140px;border:3px solid #eadfb9;border-radius:24px;background:#fff;font-size:19px;font-weight:900}.mode b{display:block;font-size:47px}.timer{font-size:23px;font-weight:900;background:#fff3c9;border-radius:16px;padding:8px 13px;display:inline-block}.round{font-size:22px;font-weight:950;margin:10px}.foundbox{margin:12px auto;padding:13px;background:#fff7d8;border-radius:20px;max-width:800px}.found{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:8px}.tag{font-size:22px;font-weight:900;padding:8px 11px;background:#fff;border-radius:15px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;max-width:800px;margin:14px auto}.n{height:82px;border:4px solid #ecdba8;border-radius:19px;background:#fff;font-size:39px;font-weight:900}.n.s{border-color:#ff789c;background:#fff0f5}.n.hint{opacity:.43}.n.spent{opacity:.17}.ten{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:400px;margin:10px auto}.c{aspect-ratio:1;border:3px solid #b9abc2;border-radius:8px}.f{background:#ffd76a}.msg{font-size:20px;font-weight:850;min-height:52px}.go,.soft{padding:13px 19px;margin:5px;border-radius:18px;font-weight:900}.go{background:#ff789c;color:#fff;font-size:20px}.soft{background:#eee8f1}.record{font-size:26px;font-weight:900;margin:15px}.big{font-size:70px}@media(max-width:600px){.cards{grid-template-columns:repeat(4,1fr)}.n{height:75px}.menu{grid-template-columns:1fr}}
</style></head><body><div id="a"></div><script>
(function(){var A=document.getElementById("a"),tick,start,round1time=0;
function load(k){try{return Number(localStorage.getItem(k)||0)}catch(e){return 0}}function save(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function fmt(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return m?m+"분 "+String(s).padStart(2,"0")+"초":s+"초"}
function timerStart(){start=Date.now();clearInterval(tick);tick=setInterval(function(){var e=document.getElementById("timer");if(e)e.textContent="⏱ "+fmt(Date.now()-start)},250)}
function elapsed(){return Date.now()-start}function frame(n){var t=document.getElementById("ten");if(!t)return;t.innerHTML="";for(var i=0;i<10;i++){var c=document.createElement("div");c.className="c"+(i<Math.min(n,10)?" f":"");t.appendChild(c)}}
function home(){clearInterval(tick);A.innerHTML='<div class="p"><h1>🔟 10 탐험대 V4.1</h1><p>두 장의 비밀이 이제 <b>두 판</b>으로 커졌어요!</p><div class="menu"><button class="mode" id="pair"><b>🔍</b>두 장의 비밀<br><small>1판 5가지 → 2판 6가지</small></button><button class="mode" id="use"><b>🏕️</b>카드 모두 활용<br><small>16장 · 8묶음</small></button></div><p>2판에는 새로운 친구 <b>10과 0</b>도 등장해요.</p></div>';document.getElementById("pair").onclick=introPair;document.getElementById("use").onclick=introUse}
function introPair(){A.innerHTML='<div class="p"><h1>🔍 두 장의 비밀</h1><p>1판과 2판에 숨어 있는 10을 모두 찾아보자.</p><p><b>2판에는 10과 0도 등장!</b></p><p>시작부터 두 판을 모두 끝낼 때까지 시간을 재요.</p><button class="go" id="s">시작!</button><button class="soft" id="b">다른 게임</button></div>';document.getElementById("s").onclick=function(){timerStart();pairRound(1)};document.getElementById("b").onclick=home}
function pairRound(r){var board=r===1?[1,2,3,4,5,5,6,7,8,9]:[10,9,8,7,6,5,5,4,3,2,1,0],ans=r===1?["1+9","2+8","3+7","4+6","5+5"]:["0+10","1+9","2+8","3+7","4+6","5+5"],found={},sel=[];
A.innerHTML='<div class="p"><div class="timer" id="timer">⏱ '+fmt(elapsed())+'</div><div class="round">🌟 '+r+'판 / 2판</div><div class="foundbox"><b>✨ 내가 찾은 10</b><div class="found" id="found">찾을 때마다 여기에 크게 모여요</div></div><b id="prog">0 / '+ans.length+' 발견</b><div class="ten" id="ten"></div><div class="cards" id="cards"></div><div class="msg" id="msg">'+(r===2?"10과 0도 잘 살펴봐 👀":"두 장을 골라봐 👀")+'</div><button class="soft" id="q">그만하기</button></div>';frame(0);
board.forEach(function(v){var b=document.createElement("button");b.className="n";b.textContent=v;b.onclick=function(){if(b.classList.contains("s")){b.classList.remove("s");sel=sel.filter(function(x){return x.b!==b})}else if(sel.length<2){b.classList.add("s");sel.push({b:b,v:v})}frame(sel.reduce(function(a,x){return a+x.v},0));if(sel.length===2)setTimeout(test,160)};document.getElementById("cards").appendChild(b)});
function reset(){sel.forEach(function(x){x.b.classList.remove("s")});sel=[];frame(0)}
function test(){var vals=sel.map(function(x){return x.v}).sort(function(a,b){return a-b}),sum=vals[0]+vals[1],key=vals.join("+"),m=document.getElementById("msg");if(sum===10){if(found[key])m.textContent="이미 찾은 조합이야. 다른 10은? 🔍";else{found[key]=1;sel.forEach(function(x){x.b.classList.add("hint")});var ks=Object.keys(found);document.getElementById("prog").textContent=ks.length+" / "+ans.length+" 발견";document.getElementById("found").innerHTML=ans.filter(function(x){return found[x]}).map(function(x){return '<span class="tag">'+x+' = 10</span>'}).join("");m.textContent="✨ "+key+" = 10 발견!";if(ks.length===ans.length){if(r===1){round1time=elapsed();setTimeout(roundDone,450)}else{var total=elapsed();clearInterval(tick);setTimeout(function(){finalDone(total)},450)}return}}}else m.textContent=sum<10?(10-sum)+"만큼 더 있으면 10!":"10을 조금 지나갔네.";setTimeout(reset,500)}
document.getElementById("q").onclick=home}
function roundDone(){A.innerHTML='<div class="p"><div class="big">🌟👏🌟</div><h1>1판 성공!</h1><p>5가지 10을 모두 찾았어요.</p><div class="record">⏱ 여기까지 '+fmt(round1time)+'</div><p>이번에는 <b>10과 0</b>까지 들어 있는 2판이에요.</p><button class="go" id="next">2판 시작하기</button></div>';document.getElementById("next").onclick=function(){pairRound(2)}}
function finalDone(total){var best=load("pair2Best"),nb=!best||total<best;if(nb){best=total;save("pair2Best",total)}A.innerHTML='<div class="p"><div class="big">🎊✨🎊</div><h1>정말 잘했어요!</h1><p>두 판의 10을 <b>모두 찾았어요!</b></p><div class="record">1판 5가지 + 2판 6가지<br>모두 11가지 발견<br>⏱ 전체 기록 '+fmt(total)+'</div><p>🏆 최고기록 '+fmt(best)+(nb?" · 새 기록!":"")+'</p><button class="go" id="again">🔄 한 번 더 하기</button><button class="soft" id="other">🎮 다른 게임 하기</button></div>';document.getElementById("again").onclick=introPair;document.getElementById("other").onclick=home}
function introUse(){A.innerHTML='<div class="p"><h1>🏕️ 카드 모두 활용</h1><p>16장의 카드를 모두 사용해 8개의 10을 만들어보자.</p><button class="go" id="s">시작!</button><button class="soft" id="b">다른 게임</button></div>';document.getElementById("s").onclick=use;document.getElementById("b").onclick=home}
function use(){var d=[1,9,2,8,3,7,4,6,5,5,1,9,2,8,4,6],sel=[],made=0;d.sort(function(){return Math.random()-.5});timerStart();A.innerHTML='<div class="p"><div class="timer" id="timer">⏱ 0초</div><div class="foundbox"><b>🏕️ 내가 만든 10 묶음</b><div class="found" id="found">완성한 묶음이 여기에 남아요</div></div><b id="prog">0 / 8 묶음</b><div class="ten" id="ten"></div><div class="cards" id="cards"></div><div class="msg" id="msg">사용한 카드는 희미해지고 다시 쓸 수 없어요.</div><button class="soft" id="q">그만하기</button></div>';frame(0);
d.forEach(function(v){var b=document.createElement("button");b.className="n";b.textContent=v;b.onclick=function(){if(b.disabled)return;if(b.classList.contains("s")){b.classList.remove("s");sel=sel.filter(function(x){return x.b!==b})}else if(sel.length<2){b.classList.add("s");sel.push({b:b,v:v})}frame(sel.reduce(function(a,x){return a+x.v},0));if(sel.length===2)setTimeout(test,160)};document.getElementById("cards").appendChild(b)});
function test(){var sum=sel[0].v+sel[1].v,m=document.getElementById("msg");if(sum===10){var v=sel.map(function(x){return x.v}).sort(function(a,b){return a-b});sel.forEach(function(x){x.b.disabled=true;x.b.classList.remove("s");x.b.classList.add("spent")});sel=[];made++;frame(0);document.getElementById("prog").textContent=made+" / 8 묶음";var f=document.getElementById("found");if(made===1)f.innerHTML="";f.innerHTML+='<span class="tag">'+v.join("+")+'=10</span>';m.textContent="✨ "+made+"번째 10!";if(made===8){var e=elapsed();clearInterval(tick);setTimeout(function(){useDone(e)},450)}}else{m.textContent=sum<10?(10-sum)+"만큼 부족해 👀":"10을 지나갔네 👀";setTimeout(function(){sel.forEach(function(x){x.b.classList.remove("s")});sel=[];frame(0)},500)}}document.getElementById("q").onclick=home}
function useDone(e){var best=load("useBest"),nb=!best||e<best;if(nb){best=e;save("useBest",e)}A.innerHTML='<div class="p"><div class="big">🎉</div><h1>8묶음 모두 완성!</h1><div class="record">⏱ 이번 기록 '+fmt(e)+'</div><p>🏆 최고기록 '+fmt(best)+(nb?" · 새 기록!":"")+'</p><button class="go" id="again">🔄 한 번 더 하기</button><button class="soft" id="other">🎮 다른 게임 하기</button></div>';document.getElementById("again").onclick=introUse;document.getElementById("other").onclick=home}
home()})();
</script></body></html>

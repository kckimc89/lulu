<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 탐험대 V5.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9ea;color:#493c50;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}#a{max-width:950px;margin:auto;padding:15px}.p{background:#fff;border-radius:28px;padding:22px;text-align:center}button{border:0;font:inherit}h1{font-size:44px}.players{display:flex;justify-content:center;gap:12px}.pl,.go,.soft{padding:13px 20px;border-radius:18px;margin:5px;font-weight:900}.pl,.soft{background:#eee8f1}.pl.on{outline:4px solid #ff789c}.go{background:#ff789c;color:#fff}.games{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px}.game{min-height:130px;border:3px solid #eadfb9;border-radius:22px;background:#fff;font-size:19px;font-weight:900}.game b{display:block;font-size:43px}.timer{display:inline-block;background:#fff3c9;padding:9px 14px;border-radius:16px;font-size:23px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;max-width:820px;margin:15px auto}.memoryCards{grid-template-columns:repeat(4,1fr);max-width:720px;gap:14px}.memoryCards .n{height:128px;font-size:52px}.n{height:78px;border:4px solid #ecdba8;border-radius:18px;background:#fff;font-size:37px;font-weight:900}.n.s{border-color:#ff789c}.n.h{opacity:.42}.n.x{opacity:.16}.n.hide{font-size:0;background:#8f7d9b}.n.hide:after{content:"★";font-size:28px;color:#fff}.found{background:#fff7d8;border-radius:20px;padding:13px;margin:12px}.tag{display:inline-block;background:#fff;padding:8px 10px;margin:4px;border-radius:13px;font-size:21px;font-weight:900}.msg{font-size:20px;font-weight:850;min-height:48px}.finish{min-height:72vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px}.emoji{font-size:90px}.rec{font-size:27px;font-weight:900;background:#fff3c9;padding:18px 27px;border-radius:20px}.board{margin:15px auto;max-width:760px;background:#f5eff7;border-radius:20px;padding:14px;line-height:1.8}@media(max-width:550px){.games{grid-template-columns:1fr}.cards{grid-template-columns:repeat(4,1fr)}.n{height:70px}.memoryCards{grid-template-columns:repeat(3,1fr)}.memoryCards .n{height:108px;font-size:46px}}

.recordRow .rank{font-size:14px;opacity:.7}.bestBox{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:760px;width:100%}.bestBox>div{background:#fff3c9;border-radius:18px;padding:13px;font-weight:900;line-height:1.5}
.house{background:#ffe4a8!important;font-size:22px}.modeBtns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.modeBtn{min-width:220px;padding:22px;border-radius:23px;background:#fff;border:3px solid #eadfb9;font-size:22px;font-weight:950}.delta{font-size:13px;font-weight:800;opacity:.7}
@media(max-width:550px){.recordHead,.recordRow{grid-template-columns:1fr 42px 1fr}.bestBox{grid-template-columns:1fr}.modeBtn{min-width:180px}}
</style></head><body><div id="a"></div><script>
(function(){var A=document.getElementById("a"),P="child",tick,start,G="",seed=1,names={child:"👧 아이",mom:"👩 엄마"},gn={pair:"두 장의 비밀",use:"카드 모두 활용",triple:"세 장의 비밀",hunt:"10 사냥꾼",memory:"기억 속의 10",pairAdd:"두 장의 비밀 · 더하기 10",pairSub:"두 장의 비밀 · 빼기 5"};
function get(k,d){try{var v=localStorage.getItem("v5_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}}function set(k,v){try{localStorage.setItem("v5_"+k,JSON.stringify(v))}catch(e){}}
function fmt(ms){if(!ms)return"-";var s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return m?m+"분 "+String(s).padStart(2,"0")+"초":s+"초"}function history(g,p){return get("hist_"+g+"_"+p,[])}function best(g,p){var h=history(g,p);if(h.length)return Math.min.apply(null,h);return get("b_"+g+"_"+p,0)}function wins(p){return get("w_"+p,0)}
function ts(){start=Date.now();clearInterval(tick);tick=setInterval(function(){var e=document.getElementById("t");if(e)e.textContent="⏱ "+fmt(Date.now()-start)},250)}function te(){clearInterval(tick);return Date.now()-start}
function sh(a,s){var x=s||12345;for(var i=a.length-1;i;i--){x=(x*48271)%2147483647;var j=x%(i+1),q=a[i];a[i]=a[j];a[j]=q}return a}
function home(){clearInterval(tick);var rows="";["pairAdd","pairSub","use","triple","hunt","memory"].forEach(function(k){rows+=gn[k]+"　👧 "+fmt(best(k,"child"))+"　/　👩 "+fmt(best(k,"mom"))+"<br>"});A.innerHTML='<div class="p"><h1>🏆 10 탐험대 V5.2</h1><p><b>오늘 게임할 선수를 선택하세요</b></p><div class="players"><button class="pl '+(P==="child"?"on":"")+'" id="c">👧 아이</button><button class="pl '+(P==="mom"?"on":"")+'" id="m">👩 엄마</button></div><div class="board">누적 승리　👧 아이 <b>'+wins("child")+'승</b>　·　👩 엄마 <b>'+wins("mom")+'승</b></div><div class="games"><button class="game" data-g="pair"><b>🔍</b>두 장의 비밀<br><small>0→10 · 10→0 · 랜덤</small></button><button class="game" data-g="use"><b>🏕️</b>카드 모두 활용<br><small>16장 · 8묶음</small></button><button class="game" data-g="triple"><b>🕵️</b>세 장의 비밀<br><small>세 숫자로 10</small></button><button class="game" data-g="hunt"><b>🎯</b>10 사냥꾼<br><small>24장 · 12묶음</small></button><button class="game" data-g="memory"><b>🧠</b>기억 속의 10<br><small>보고 기억해서 짝 찾기</small></button></div><div class="board"><b>🏆 우리집 최고기록</b><br>'+rows+'</div></div>';document.getElementById("c").onclick=function(){P="child";home()};document.getElementById("m").onclick=function(){P="mom";home()};Array.prototype.forEach.call(document.querySelectorAll("[data-g]"),function(b){b.onclick=function(){var g=b.dataset.g;if(g==="pair")pairMode();else intro(g)}})}
function pairMode(){G="pair";A.innerHTML='<div class="p"><h1>🔍 두 장의 비밀</h1><p style="font-size:21px"><b>'+names[P]+'가 어떤 비밀에 도전할까요?</b></p><div class="modeBtns"><button class="modeBtn" id="add">➕<br>더해서 10<br><small>0부터 10까지</small></button><button class="modeBtn" id="sub">➖<br>빼서 5<br><small>큰 수 - 작은 수</small></button></div><button class="soft" id="back">게임 선택</button></div>';document.getElementById("add").onclick=function(){intro("pairAdd")};document.getElementById("sub").onclick=function(){intro("pairSub")};document.getElementById("back").onclick=home}
function intro(g){G=g;A.innerHTML='<div class="p"><h1>'+names[P]+' · '+gn[g]+'</h1><p>시간 제한은 없어요. 완성 기록에 도전해요!</p><button class="go" id="s">🏁 시작!</button><button class="soft" id="b">돌아가기</button></div>';document.getElementById("s").onclick=function(){seed=Date.now()%999983;if(g==="pairAdd"){ts();pair(1)}else if(g==="pairSub"){ts();subpair(1)}else play(g)};document.getElementById("b").onclick=home}
function shell(title,mem){A.innerHTML='<div class="p"><div class="timer" id="t">⏱ 0초</div><h2>'+names[P]+' · '+title+'</h2><div class="found" id="f"><b>✨ 완성한 10</b><br></div><div class="cards '+(mem?"memoryCards":"")+'" id="cards"></div><div class="msg" id="msg">카드를 골라봐 👀</div><button class="soft" id="q">그만하기</button></div>';document.getElementById("q").onclick=home}
function generic(deck,need,target){var sel=[],made=0;sh(deck,seed);shell(gn[G],false);ts();deck.forEach(function(v){var b=document.createElement("button");b.className="n";b.textContent=v;b.onclick=function(){if(b.disabled)return;if(b.classList.contains("s")){b.classList.remove("s");sel=sel.filter(function(z){return z.b!==b})}else if(sel.length<need){b.classList.add("s");sel.push({b:b,v:v})}if(sel.length===need)setTimeout(test,130)};document.getElementById("cards").appendChild(b)});function reset(){sel.forEach(function(z){z.b.classList.remove("s")});sel=[]}function test(){var sum=sel.reduce(function(a,z){return a+z.v},0),m=document.getElementById("msg");if(sum===10){var v=sel.map(function(z){return z.v}).sort(function(a,b){return a-b});sel.forEach(function(z){z.b.disabled=true;z.b.classList.remove("s");z.b.classList.add("x")});sel=[];made++;document.getElementById("f").innerHTML+='<span class="tag">'+v.join("+")+'=10</span>';m.textContent="✨ 10 완성!";if(made===target)setTimeout(function(){done(G,te())},300)}else{m.textContent=sum<10?(10-sum)+"만큼 더 필요해":"10을 지나갔네";setTimeout(reset,400)}}}
function pair(r){var d=[0,1,2,3,4,5,5,6,7,8,9,10],ans=["0+10","1+9","2+8","3+7","4+6","5+5"],f={},sel=[];if(r===2)d.reverse();if(r===3)sh(d,seed);shell("두 장의 비밀 · "+r+"/3판 · "+(r===1?"0→10":r===2?"10→0":"랜덤"),false);d.forEach(function(v){var b=document.createElement("button");b.className="n";b.textContent=v;b.onclick=function(){if(b.classList.contains("s")){b.classList.remove("s");sel=sel.filter(function(z){return z.b!==b})}else if(sel.length<2){b.classList.add("s");sel.push({b:b,v:v})}if(sel.length===2)setTimeout(test,130)};document.getElementById("cards").appendChild(b)});function reset(){sel.forEach(function(z){z.b.classList.remove("s")});sel=[]}function test(){var v=sel.map(function(z){return z.v}).sort(function(a,b){return a-b}),sum=v[0]+v[1],k=v.join("+");if(sum===10&&!f[k]){f[k]=1;sel.forEach(function(z){z.b.classList.add("h")});document.getElementById("f").innerHTML="<b>✨ 완성한 10</b><br>"+ans.filter(function(x){return f[x]}).map(function(x){return'<span class="tag">'+x+'=10</span>'}).join("");if(Object.keys(f).length===6){if(r<3)setTimeout(function(){pair(r+1)},350);else setTimeout(function(){done("pairAdd",te())},350);return}}setTimeout(reset,350)}}
function subpair(r){var d=[0,1,2,3,4,5,5,6,7,8,9,10],ans=["5-0","6-1","7-2","8-3","9-4","10-5"],f={},sel=[];if(r===2)d.reverse();if(r===3)sh(d,seed);shell("빼서 5 · "+r+"/3판 · "+(r===1?"0→10":r===2?"10→0":"랜덤"),false);d.forEach(function(v){var b=document.createElement("button");b.className="n";b.textContent=v;b.onclick=function(){if(b.classList.contains("s")){b.classList.remove("s");sel=sel.filter(function(z){return z.b!==b})}else if(sel.length<2){b.classList.add("s");sel.push({b:b,v:v})}if(sel.length===2)setTimeout(test,120)};document.getElementById("cards").appendChild(b)});function reset(){sel.forEach(function(z){z.b.classList.remove("s")});sel=[]}function test(){var v=sel.map(function(z){return z.v}).sort(function(a,b){return b-a}),k=v[0]+"-"+v[1],diff=v[0]-v[1];if(diff===5&&!f[k]){f[k]=1;sel.forEach(function(z){z.b.classList.add("h")});document.getElementById("f").innerHTML="<b>✨ 완성한 빼기 5</b><br>"+ans.filter(function(x){return f[x]}).map(function(x){return'<span class="tag">'+x+'=5</span>'}).join("");document.getElementById("msg").textContent="✨ "+k+"=5 발견!";if(Object.keys(f).length===6){if(r<3)setTimeout(function(){subpair(r+1)},300);else setTimeout(function(){done("pairSub",te())},300);return}}else document.getElementById("msg").textContent=diff<5?"차이가 5보다 작아요":"차이가 5보다 커요";setTimeout(reset,350)}}
function play(g){if(g==="use")generic([1,9,2,8,3,7,4,6,5,5,1,9,2,8,4,6],2,8);else if(g==="triple")generic([1,2,7,1,3,6,1,4,5,2,3,5],3,4);else if(g==="hunt")generic([0,10,1,9,2,8,3,7,4,6,5,5,0,10,1,9,2,8,3,7,4,6,5,5],2,12);else memory()}
function memory(){var d=[0,10,1,9,2,8,3,7,4,6,5,5],sel=[],made=0;sh(d,seed);shell(gn.memory,true);var bs=[];d.forEach(function(v){var b=document.createElement("button");b.className="n";b.textContent=v;b.dataset.v=v;document.getElementById("cards").appendChild(b);bs.push(b)});document.getElementById("msg").textContent="4초 동안 잘 기억해! 👀";setTimeout(function(){bs.forEach(function(b){b.classList.add("hide");b.onclick=pick});ts();document.getElementById("msg").textContent="10의 짝을 기억해서 찾아봐!"},4000);function pick(){if(this.disabled||this.classList.contains("s"))return;this.classList.remove("hide");this.classList.add("s");sel.push(this);if(sel.length===2)setTimeout(test,250)}function test(){var sum=Number(sel[0].dataset.v)+Number(sel[1].dataset.v);if(sum===10){var v=[+sel[0].dataset.v,+sel[1].dataset.v].sort(function(a,b){return a-b});sel.forEach(function(b){b.disabled=true;b.classList.remove("s");b.classList.add("x")});sel=[];made++;document.getElementById("f").innerHTML+='<span class="tag">'+v.join("+")+'=10</span>';if(made===6)setTimeout(function(){done("memory",te())},300)}else{var old=sel.slice();sel=[];setTimeout(function(){old.forEach(function(b){b.classList.remove("s");b.classList.add("hide")})},500)}}}
function done(g,t){var oldH=history(g,P).slice(),oldPersonal=oldH.length?Math.min.apply(null,oldH):best(g,P),other=P==="child"?"mom":"child",otherH=history(g,other),otherBest=best(g,other),oldOverall=0;if(oldPersonal&&otherBest)oldOverall=Math.min(oldPersonal,otherBest);else oldOverall=oldPersonal||otherBest||0;var personalNew=!oldPersonal||t<oldPersonal,houseNew=!oldOverall||t<oldOverall;var h=oldH.slice();h.push(t);if(h.length>30)h=h.slice(-30);set("hist_"+g+"_"+P,h);if(personalNew)set("b_"+g+"_"+P,t);var ch=P==="child"?h:otherH,mh=P==="mom"?h:otherH,cb=ch.length?Math.min.apply(null,ch):best(g,"child"),mb=mh.length?Math.min.apply(null,mh):best(g,"mom"),overall=cb&&mb?Math.min(cb,mb):(cb||mb);function last10(arr){return arr.slice().reverse().slice(0,10)}var cl=last10(ch),ml=last10(mh),rows="";for(var q=0;q<10;q++){var cv=cl[q],mv=ml[q],cd="",md="";if(q>0&&cv&&cl[q-1])cd=cl[q-1]<cv?"▲ "+fmt(cv-cl[q-1])+" 빨라짐":cl[q-1]>cv?"▼ "+fmt(cl[q-1]-cv):"같음";if(q>0&&mv&&ml[q-1])md=ml[q-1]<mv?"▲ "+fmt(mv-ml[q-1])+" 빨라짐":ml[q-1]>mv?"▼ "+fmt(ml[q-1]-mv):"같음";rows+='<div class="recordRow"><div>'+(cv?fmt(cv):"-")+(cd?'<br><span class="delta">'+cd+'</span>':"")+'</div><div class="rank">'+(q===0?"최근":q+1+"회전")+'</div><div>'+(mv?fmt(mv):"-")+(md?'<br><span class="delta">'+md+'</span>':"")+'</div></div>'}var praise=houseNew?"🏆🎉 우리집 전체 최고기록!":personalNew?"🎉 "+names[P]+" 개인 최고기록!":"👏 또 하나의 기록을 만들었어요!";var cmp="";if(otherBest)cmp=t<otherBest?names[other]+" 최고기록보다 "+fmt(otherBest-t)+" 빨라요!":names[other]+" 최고기록까지 "+fmt(t-otherBest)+" 남았어요!";A.innerHTML='<div class="p finish"><div class="emoji">'+(houseNew?"🏆✨🏆":personalNew?"🏅✨":"👏🎊")+'</div><h1>'+praise+'</h1><div class="rec">⏱ 이번 기록 '+fmt(t)+'</div><div class="bestBox"><div>👧 아이 최고<br><b>'+fmt(cb)+'</b></div><div>👩 엄마 최고<br><b>'+fmt(mb)+'</b></div><div class="house" style="grid-column:1/-1">🏆 우리집 전체 최고<br><b>'+fmt(overall)+'</b></div></div><div class="compare">'+cmp+'</div><div class="records"><div class="recordHead"><div>👧 아이 최근 10회</div><div></div><div>👩 엄마 최근 10회</div></div>'+rows+'</div><div><button class="go" id="again">🔄 같은 선수로 다시 도전</button><button class="soft" id="choose">👥 선수 선택</button><button class="soft" id="home">🎮 게임 선택</button></div></div>';document.getElementById("again").onclick=function(){if(g==="pairAdd"||g==="pairSub")pairMode();else intro(g)};document.getElementById("choose").onclick=function(){A.innerHTML='<div class="p"><h1>👥 선수를 선택하세요</h1><div class="players"><button class="pl" id="cc">👧 아이</button><button class="pl" id="mm">👩 엄마</button></div><button class="soft" id="hh">게임 선택</button></div>';document.getElementById("cc").onclick=function(){P="child";if(g==="pairAdd"||g==="pairSub")pairMode();else intro(g)};document.getElementById("mm").onclick=function(){P="mom";if(g==="pairAdd"||g==="pairSub")pairMode();else intro(g)};document.getElementById("hh").onclick=home};document.getElementById("home").onclick=home}
home()})();
</script></body></html>
